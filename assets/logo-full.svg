<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <circle cx="250" cy="250" r="235" fill="#ffffff" stroke="#2E3190" stroke-width="10"/>
  <!-- Blue C: same proportions as logo-mark, 2.5× scale, centered at (222,222) -->
